[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arxiv-mcp-pro"
version = "0.8.0"
description = "A flexible arXiv search and analysis service with MCP protocol support"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
keywords = ["mcp", "arxiv", "model-context-protocol", "llm", "research", "papers", "semantic-search", "ai", "academic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
authors = [
    { name = "Joseph Blazick", email = "blazickjp@amazon.com" }
]
maintainers = [
    { name = "Logan Rooks" }
]
# Direct imports only. aiohttp / python-dotenv / sse-starlette were declared
# here for years with zero import sites in src (inherited cruft); sse-starlette
# still arrives transitively via mcp, dotenv via pydantic-settings — dropping
# aiohttp removes an 8-package subtree from a clean install. anyio was in that
# same group until the stdio guard gave it a real import site in server.py, so
# it is declared again rather than relied on transitively through mcp. arxiv is pinned <3: 4.x swaps feedparser for lxml (~20 MB
# compiled) and has never been what uv.lock tests against (2.4.0).
dependencies = [
    "arxiv>=2.1.0,<3",
    "httpx>=0.24.0",
    "python-dateutil>=2.8.2",
    "pydantic>=2.8.0",
    # Direct import in server.py: `anyio.wrap_file` adapts the guard's private
    # protocol stream for `stdio_server`. It also arrives via mcp, but relying
    # on that would break the import on any mcp release that drops it.
    "anyio>=4.0.0",
    # mcp 2.0 removed the low-level `Server` decorator API (list_prompts,
    # get_prompt, list_tools, call_tool) that server.py is built on. Pinned
    # below 2 until that migration is done; see CHANGELOG under [Unreleased].
    "mcp>=1.27.0,<3",
    "pydantic-settings>=2.1.0",
    "aiofiles>=23.2.1",
    "uvicorn>=0.30.0",
    "starlette>=0.27.0",
]

[project.urls]
Repository = "https://github.com/loganrooks/arxiv-mcp-pro"
Issues = "https://github.com/loganrooks/arxiv-mcp-pro/issues"
Documentation = "https://github.com/loganrooks/arxiv-mcp-pro#readme"

[project.optional-dependencies]
pdf = [
    "pymupdf4llm>=0.0.17",
    "pymupdf-layout>=1.26.6",
]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.10.0",
    "aioresponses>=0.7.6",
    # black is needed here because the `gates` CI job runs the pre-commit hooks
    # with `language: system`, taking black from `pip install -e ".[test]"`.
    # (It used to arrive via the runtime deps; that was wrong — it is dev-time
    # tooling — so it now lives in the test/dev extras, not the base install.)
    "black>=25.1.0",
    # numpy is needed for the semantic_search test suite to actually RUN in CI
    # (the tests `importorskip("numpy")`; it otherwise lives only in the heavy
    # `pro` extra, so CI silently skipped them). sentence-transformers is NOT
    # needed — those tests monkeypatch the model.
    "numpy>=1.26.0",
    # networkx is needed for the library_influence (C5) test suite to actually
    # RUN in CI. It otherwise lives only in the `influence` extra; mirroring the
    # numpy lesson above, a test-only dep that lives solely in a feature extra
    # makes CI silently skip the whole suite. scipy is required because
    # networkx>=3's public `pagerank` dispatches to its scipy solver with no
    # pure-python fallback (it raises ModuleNotFoundError otherwise).
    "networkx>=3.0",
    "scipy>=1.10",
]
dev = [
    "black>=23.3.0"
]
pro = [
    "sentence-transformers>=3.0.0",
    "numpy>=1.26.0",
]
influence = [
    "networkx>=3.0",
    # networkx's public pagerank() uses the scipy solver (no pure-python
    # fallback in networkx>=3), so scipy is a hard runtime requirement here.
    "scipy>=1.10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_fixture_loop_scope = "function"  # Added this line
testpaths = ["tests"]
# The repo root, so `tests/scripts/` can import the `scripts/` helpers under a
# bare `pytest` (what CI runs). `python -m pytest` prepends the CWD and would
# have masked the difference locally.
pythonpath = ["."]
addopts = "-v --cov=arxiv_mcp_server"

[project.scripts]
arxiv-mcp-pro = "arxiv_mcp_server:main"
# Back-compat alias: existing MCP configs invoking `arxiv-mcp-server` keep working.
arxiv-mcp-server = "arxiv_mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/arxiv_mcp_server"]

# Keep the published sdist to source + essential metadata. The default hatchling
# sdist sweeps in everything the *repo-local* .gitignore doesn't exclude — which
# includes repo/agent internals (CLAUDE.md, .claude/, AGENTS.md, docs/governance/,
# .github/) AND the private `goal/` planning repo (ignored only via a *global*
# gitignore hatchling does not honor). Patterns are leading-slash-anchored to root
# so they don't recurse (an unanchored `README.md` matches `goal/README.md` too).
# The wheel is already scoped to the package above.
[tool.hatch.build.targets.sdist]
include = [
    "/src/arxiv_mcp_server",
    "/tests",
    # `/tests/scripts/` imports from here, so shipping the tests without it
    # gives downstream packagers a collection error, not a test run.
    "/scripts",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/pyproject.toml",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.black]
line-length = 88
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | mcpb-build
  | goal
)/
'''
