name: Lint

# Check-only. Black is enforced locally by pre-commit and by the `gates` job in
# ci.yml, so code reaching CI is already formatted; this fails fast (with a diff)
# if it is not. It deliberately does NOT auto-format and push back to the branch:
# a CI push to a protected `main` (enforce_admins + required checks) is a
# foot-gun, and the auto-fix was redundant with the local + gates enforcement.

on:
  push:
    branches: [ main ]
  # No `branches` filter: that matches the PR's BASE, so a stacked PR — one
  # based on another feature branch — would run neither this workflow nor the
  # other. It would then display green off a single unrelated check for its
  # whole review window, which is a false green of exactly the kind this
  # project has been bitten by before.
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: pyproject.toml

    - name: Install Black
      run: pip install black

    - name: Check formatting (fail with diff if unformatted)
      run: black --check --diff .
